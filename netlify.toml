# De Broekhof beheer — Netlify
# Geen build-stap: public/ wordt zo uitgeleverd. Functions gebruiken alleen
# ingebouwde Node-modules en fetch (geen npm-pakketten).

[build]
  publish   = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Robots-Tag           = "noindex, nofollow"

[[headers]]
  for = "/releasenotes.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/handleiding.html"
  [headers.values]
    Cache-Control = "no-store"
